# Copy to .github/workflows/review-bot.yml in your repository.
name: review-bot
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write     # only needed when post: "true"
  security-events: write   # only needed for upload-sarif

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # so .reviewbot.toml is available
      - uses: sakshamchitkara-dotcom/review-bot@main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}  # empty on fork PRs -> static-only
          post: "false"      # set "true" to post inline review comments
          fail-on: ""        # e.g. "high" to block merges on high/critical findings
          upload-sarif: "true"   # findings show up under Security > Code scanning
