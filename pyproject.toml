[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-bot"
version = "0.5.0"
description = "Autonomous AI code reviewer: static heuristics + Claude, for local diffs and GitHub PRs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "anthropic>=1.0",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
review-bot = "review_bot.cli:main"

[tool.setuptools]
packages = ["review_bot"]
